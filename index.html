<!DOCTYPE ht<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAPISO AI - Smart AI for Everyone</title>
  <style>
    body { font-family: Arial; background: #0a0a0a; color: white; padding: 20px; max-width: 700px; margin: auto; }
    h1 { color: #00ff88; text-align: center; }
    p { text-align: center; color: #aaa; }
    #chat { background: #1a1a1a; padding: 15px; border-radius: 10px; height: 400px; overflow-y: auto; margin-bottom: 10px; border: 1px solid #333; }
    .user { color: #00ff88; margin: 10px 0; font-weight: bold; }
    .ai { color: #ffffff; margin: 10px 0; }
    .input-box { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #2a2a2a; color: white; font-size: 16px; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #00ff88; color: black; font-weight: bold; font-size: 16px; }
    button:active { background: #00cc70; }
  </style>
</head>
<body>
  <h1>Welcome to PAPISO AI 🇱🇸</h1>
  <p>Smart AI for Everyone. Talk to me in Sesotho or English!</p>
  
  <div id="chat"></div>
  
  <div class="input-box">
    <input type="text" id="msg" placeholder="Ngola molaetsa wa hao..." onkeypress="if(event.key==='Enter') send()">
    <button onclick="send()">Send</button>
  </div>

  <script>
    async function send() {
      const msgInput = document.getElementById('msg');
      const msg = msgInput.value;
      if(!msg) return;
      
      document.getElementById('chat').innerHTML += `<div class="user">You: ${msg}</div>`;
      msgInput.value = '';
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
      
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: msg})
      });
      const data = await res.json();
      document.getElementById('chat').innerHTML += `<div class="ai">PAPISO: ${data.reply}</div>`;
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }
  </script>
</body>
</html>
